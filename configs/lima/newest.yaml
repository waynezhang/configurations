cpus: 4
memory: 16GiB
disk: 60GiB
vmType: "vz"
vmOpts:
  vz:
    rosetta:
      enabled: false
      binfmt: false
images:
  - location: "https://github.com/lima-vm/alpine-lima/releases/download/v0.2.37/alpine-lima-std-3.19.0-x86_64.iso"
    arch: "x86_64"
    digest: "sha512:568852df405e6b9858e678171a9894c058f483df0b0570c22cf33fc75f349ba6cc5bb3d50188180d8c31faaf53400fe884ca3e5f949961b03b2bf53e65de88d7"
  - location: "https://github.com/lima-vm/alpine-lima/releases/download/v0.2.37/alpine-lima-std-3.19.0-aarch64.iso"
    arch: "aarch64"
    digest: "sha512:3a4bd5ad0201f503e9bb9f3b812aa0df292e2e099148c0323d23244046ad199a2946ef9e0619fec28726bfdcc528233f43c3b4b036c9e06e92ac730d579f0ca3"
mountType: "virtiofs"
mounts:
  - location: "~"
    mountPoint: "/Users/l-zhang"
    writable: true
  - location: "/tmp/lima"
    writable: true
containerd:
  system: false
  user: false
networks:
  - lima: user-v2
provision:
  - mode: system
    script: >
      #!/bin/sh sed -i 's/host.lima.internal.*/host.lima.internal host.rancher-desktop.internal host.docker.internal/' /etc/hosts

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      apk add docker openrc
      rc-update add docker boot
      addgruop "{{.User}}" docker
  - mode: system
    script: |
      #!/bin/bash
      service docker start
probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 30s bash -c "until command -v docker >/dev/null 2>&1; do sleep 3; done"; then
        echo >&2 "docker is not installed yet"
        exit 1
      fi
      sudo chmod 666 /var/run/docker.sock
    hint: See "/var/log/cloud-init-output.log". in the guest
portForwards:
  - guestSocket: /var/run/docker.sock
    hostSocket: "{{.Dir}}/sock/docker.sock"
  - guestPortRange:
      - 1
      - 65535
    hostIP: 0.0.0.0
message: |
  To run `docker` on the host (assumes docker-cli is installed):
  $ docker context create lima --docker "host=unix://{{.Dir}}/sock/docker.sock"
  $ docker context use lima
  $ docker ...
