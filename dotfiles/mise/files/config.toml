[bootstrap.packages]
"brew:openssl@3" = "latest"
"brew:waynezhang/tap/toyskkserv" = "latest"

"brew-cask:alfred" = "latest"
"brew-cask:appcleaner" = "latest"
"brew-cask:bitwarden" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:grammarly-desktop" = "latest"
"brew-cask:hammerspoon" = "latest"
"brew-cask:itsycal" = "latest"
"brew-cask:macskk" = "latest"
