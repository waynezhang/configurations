"brew-cask:notion" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:wezterm@nightly" = "latest"

[tasks."toyskkserv:install"]
description = "Generate launchd plist and start toyskkserv"
run = '''
set -e
LABEL=local.toyskkserv
PLIST="$HOME/Library/LaunchAgents/$LABEL.plist"
mkdir -p "$HOME/Library/LaunchAgents" "$HOME/Library/Logs"
cat > "$PLIST" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>Label</key><string>$LABEL</string>
  <key>ProgramArguments</key>
  <array>
    <string>/opt/homebrew/bin/toyskkserv</string>
    <string>serve</string>
  </array>
  <key>RunAtLoad</key><true/>
  <key>KeepAlive</key><true/>
  <key>StandardOutPath</key><string>$HOME/Library/Logs/toyskkserv.log</string>
  <key>StandardErrorPath</key><string>$HOME/Library/Logs/toyskkserv.log</string>
</dict>
</plist>
EOF
launchctl bootout gui/$(id -u)/$LABEL 2>/dev/null || true
launchctl bootstrap gui/$(id -u) "$PLIST"
'''

[settings.self_update]
auto = true

[settings]
minimum_release_age = "1h"
github.credential_command = "gh auth token"
